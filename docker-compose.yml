name: on-the-spot

services:
  on-the-spot:
    container_name: on-the-spot-app
    build:
      context: .
      args:
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
    env_file: .env
    # Local runs publish a port; on the server Caddy reaches the container over the proxy network.
    ports:
      - "127.0.0.1:${APP_PORT:-3200}:3000"
    networks: [default, proxy]
    restart: unless-stopped

networks:
  proxy:
    name: ${PROXY_NETWORK:-zimran_proxy}
    external: ${PROXY_EXTERNAL:-false}
